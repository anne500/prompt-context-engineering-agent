<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title desc">
<title id="title">Original format failures and revised passes</title><desc id="desc">Prompt mode changed from a 42-word paragraph to 36 words in three bullets. Context mode changed from a 37-word paragraph to 42 words in three bullets. Both original answers met the length limit but failed the bullet requirement.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="585" rx="0" fill="#F8FAFC" stroke="none"/><text x="40" y="50" font-size="32" fill="#172554" font-weight="700">Recorded format checks</text><text x="40" y="86" font-size="19" fill="#475569" font-weight="400">One observation per mode and prompt version. Format checks do not score factual quality.</text><text x="42" y="137" font-size="17" fill="#475569" font-weight="700">MODE</text><text x="405" y="137" font-size="17" fill="#475569" font-weight="700">FIRST RUN</text><text x="800" y="137" font-size="17" fill="#475569" font-weight="700">REVISED INSTRUCTIONS</text><text x="42" y="209" font-size="22" fill="#172554" font-weight="700">Prompt engineered</text><rect x="400" y="161" width="365" height="100" rx="16" fill="#FEE2E2" stroke="none"/><text x="420" y="197" font-size="24" fill="#991B1B" font-weight="700">FAIL</text><text x="420" y="230" font-size="18" fill="#172554" font-weight="400">42 words | paragraph, no bullets</text><rect x="795" y="161" width="365" height="100" rx="16" fill="#DCFCE7" stroke="none"/><text x="815" y="197" font-size="24" fill="#166534" font-weight="700">PASS</text><text x="815" y="230" font-size="18" fill="#172554" font-weight="400">36 words | three bullet lines</text><text x="42" y="331" font-size="22" fill="#172554" font-weight="700">Context engineered</text><rect x="400" y="283" width="365" height="100" rx="16" fill="#FEE2E2" stroke="none"/><text x="420" y="319" font-size="24" fill="#991B1B" font-weight="700">FAIL</text><text x="420" y="352" font-size="18" fill="#172554" font-weight="400">37 words | paragraph, no bullets</text><rect x="795" y="283" width="365" height="100" rx="16" fill="#DCFCE7" stroke="none"/><text x="815" y="319" font-size="24" fill="#166534" font-weight="700">PASS</text><text x="815" y="352" font-size="18" fill="#172554" font-weight="400">42 words | three bullet lines</text><rect x="40" y="432" width="1120" height="83" rx="16" fill="#DBEAFE" stroke="none"/><text x="60" y="463" font-size="20" fill="#172554" font-weight="400">Checks: exactly 3 nonempty lines, each starting with &quot;- &quot;, and fewer than 80 words.</text><text x="60" y="494" font-size="18" fill="#334155" font-weight="400">Baseline: 536 words in each run; no format constraint was requested.</text><text x="40" y="553" font-size="18" fill="#475569" font-weight="400">Evidence: validation-results.txt  |  Word counts exclude bullet markers.</text></g></svg>