<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Prompt and context engineering: three input modes</title><desc id="desc">Baseline supplies a question; prompt engineering adds output rules; context engineering also supplies a reference. All use the same local model, with no tools.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="520" rx="0" fill="#F8FAFC" stroke="none"/><rect x="0" y="0" width="1200" height="180" rx="0" fill="#0F172A" stroke="none"/><text x="42" y="48" font-size="18" fill="#93C5FD" font-weight="700">PROJECT 04  /  LOCAL AI LEARNING LAB</text><text x="42" y="101" font-size="36" fill="#FFFFFF" font-weight="700">Better instructions. Better evidence.</text><text x="42" y="144" font-size="23" fill="#CBD5E1" font-weight="400">Prompt engineering + context engineering for AI agents</text><rect x="40" y="210" width="336" height="150" rx="16" fill="#E2E8F0" stroke="none"/><text x="60" y="245" font-size="19" fill="#334155" font-weight="700">01  BASELINE</text><text x="60" y="286" font-size="18" fill="#172554" font-weight="400">Question only</text><text x="60" y="318" font-size="18" fill="#172554" font-weight="400">Observe default behavior</text><rect x="432" y="210" width="336" height="150" rx="16" fill="#DBEAFE" stroke="none"/><text x="452" y="245" font-size="19" fill="#1D4ED8" font-weight="700">02  PROMPT</text><text x="452" y="286" font-size="18" fill="#172554" font-weight="400">Question + output rules</text><text x="452" y="318" font-size="18" fill="#172554" font-weight="400">Specify format and audience</text><rect x="824" y="210" width="336" height="150" rx="16" fill="#EDE9FE" stroke="none"/><text x="844" y="245" font-size="19" fill="#6D28D9" font-weight="700">03  CONTEXT</text><text x="844" y="286" font-size="18" fill="#172554" font-weight="400">Question + rules + reference</text><text x="844" y="318" font-size="18" fill="#172554" font-weight="400">Supply relevant evidence</text><rect x="40" y="387" width="1120" height="61" rx="16" fill="#DCFCE7" stroke="none"/><text x="62" y="425" font-size="21" fill="#14532D" font-weight="700">Same local Qwen 3.5 4B model  |  No tools  |  Manually supplied reference</text><text x="42" y="486" font-size="16" fill="#1D4ED8" font-weight="700">LEARN</text><text x="143" y="486" font-size="18" fill="#172554" font-weight="400">Design inputs</text><text x="424" y="486" font-size="16" fill="#15803D" font-weight="700">SHOW</text><text x="523" y="486" font-size="18" fill="#172554" font-weight="400">Preserve evidence</text><text x="818" y="486" font-size="16" fill="#6D28D9" font-weight="700">RESEARCH</text><text x="953" y="486" font-size="18" fill="#172554" font-weight="400">Measure separately</text></g></svg>